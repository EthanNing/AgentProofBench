<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">AgentProofBench — Reusable Verifiers for Web Agents</title>
<desc id="desc">97 tasks, 79 families, four Web services. Acceptance tests, changed initial requirements, and matched execution histories.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#edf4fd"/><stop offset=".62" stop-color="#f8f9f7"/><stop offset="1" stop-color="#fff6e6"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cbd8e5" stroke-width=".5" opacity=".52"/></pattern>
 <clipPath id="clip"><rect width="1400" height="440" rx="24"/></clipPath>
 <filter id="shadow" x="-20%" y="-40%" width="150%" height="190%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#405978" flood-opacity=".09"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m2 1 4 3-4 3" fill="none" stroke="#8da4bc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g clip-path="url(#clip)">
 <rect width="1400" height="440" fill="url(#paper)"/><rect width="1400" height="440" fill="url(#grid)"/>
 <circle cx="1170" cy="238" r="246" fill="#e5edf8" opacity=".30"/>
 <circle cx="1340" cy="30" r="186" fill="#fff0d5" opacity=".35"/>
 <g font-family="Arial, Helvetica, sans-serif">
  <text x="66" y="68" font-size="13" letter-spacing="3" fill="#5271ae">REUSABLE VERIFICATION · WEB AGENTS</text>
  <text x="63" y="159" font-size="74" font-weight="700" letter-spacing="-2.8" fill="#20334b">AgentProofBench</text>
  <text x="66" y="216" font-size="29" fill="#5271ae">One rule. Changing requirements.</text>
  <text x="66" y="255" font-size="29" fill="#5271ae">Visible consequences.</text>
  <path d="M66 291H809" stroke="#cdd9e7" stroke-width="1"/>
  <g fill="#20334b"><text x="66" y="342" font-size="34" font-weight="700">97<tspan dx="10" font-size="17" font-weight="400">tasks</tspan></text>
   <text x="255" y="342" font-size="34" font-weight="700">79<tspan dx="10" font-size="17" font-weight="400">families</tspan></text>
   <text x="486" y="342" font-size="34" font-weight="700">4<tspan dx="10" font-size="17" font-weight="400">Web services</tspan></text></g>
  <text x="67" y="394" font-size="17" fill="#718299">Trace the decision into delivered work.</text>
  <path d="M1007 135C930 151 927 177 973 206M985 268C1042 282 1036 314 1008 333" fill="none" stroke="#8da4bc" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g transform="translate(1005 37)" filter="url(#shadow)">
   <rect width="328" height="104" rx="16" fill="#fff" stroke="#cedbec"/>
   <rect x="19" y="23" width="45" height="57" rx="7" fill="#eef4fc" stroke="#a1b8d4"/>
   <path d="m29 42 6 6 13-16M30 61h22M30 69h13" fill="none" stroke="#5271ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="87" y="35" font-size="11" letter-spacing="2" fill="#7c8ca2">01 / ACCEPTANCE</text>
   <text x="86" y="61" font-size="21" font-weight="600" fill="#20334b">Test the outcome</text>
   <text x="87" y="83" font-size="14" fill="#718299">Valid work and targeted failures</text>
  </g>
  <g transform="translate(962 169)" filter="url(#shadow)">
   <rect width="328" height="104" rx="16" fill="#fff" stroke="#cedbec"/>
   <circle cx="35" cy="57" r="17" fill="#fff3d9" stroke="#dfc184"/><circle cx="62" cy="57" r="17" fill="#eaf1fc" stroke="#9ab1d0"/>
   <text x="35" y="63" text-anchor="middle" font-size="18" fill="#a58037">A</text><text x="62" y="63" text-anchor="middle" font-size="18" fill="#5271ae">B</text>
   <path d="M30 30C46 14 67 22 71 33" fill="none" stroke="#8da4bc" stroke-width="1.4" marker-end="url(#arrow)"/>
   <text x="99" y="35" font-size="11" letter-spacing="2" fill="#7c8ca2">02 / REUSE</text>
   <text x="98" y="61" font-size="21" font-weight="600" fill="#20334b">Change the context</text>
   <text x="99" y="83" font-size="14" fill="#718299">Keep the verifier frozen</text>
  </g>
  <g transform="translate(1005 301)" filter="url(#shadow)">
   <rect width="328" height="104" rx="16" fill="#fff" stroke="#cedbec"/>
   <path d="M28 56C45 56 44 32 62 32M38 56C48 56 46 78 64 78" fill="none" stroke="#a4b3c5" stroke-width="1.8"/>
   <circle cx="27" cy="56" r="7" fill="#eef4fc" stroke="#8faacc" stroke-width="1.6"/>
   <path d="m60 31 5 5 10-13" fill="none" stroke="#5271ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M59 78h16" stroke="#bb9650" stroke-width="2" stroke-linecap="round"/>
   <text x="87" y="35" font-size="11" letter-spacing="2" fill="#7c8ca2">03 / EXECUTION</text>
   <text x="86" y="61" font-size="21" font-weight="600" fill="#20334b">Follow the decision</text>
   <text x="87" y="83" font-size="14" fill="#718299">Matched states and histories</text>
  </g>
 </g>
</g></svg>
